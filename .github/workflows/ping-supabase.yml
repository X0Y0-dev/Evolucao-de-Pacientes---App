
name: Ping Supabase Project

on:
  schedule:
    # Executa a cada 12 horas (UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Send Request to Supabase API
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -e

          BASE_URL="${API_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          curl --fail --silent --show-error \
            -X POST "${BASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
