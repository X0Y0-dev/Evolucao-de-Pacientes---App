name: Ping Supabase Project

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # mata o job se algo travar

    steps:
      - name: Send Request to Supabase API
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -e

          BASE_URL="${API_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          STATUS=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 \
            --output /tmp/resp.txt --write-out "%{http_code}" \
            -X POST "${BASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP ${STATUS}"
          cat /tmp/resp.txt
          echo

          [ "${STATUS}" = "200" ]
